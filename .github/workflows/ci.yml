name: SGMO validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sgmo-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sgmo_auth_test_ci
          POSTGRES_USER: postgres
          # Exclusiva del contenedor desechable: nunca una credencial operativa.
          POSTGRES_PASSWORD: sgmo-ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sgmo_auth_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SGMO_AUTH_TEST_DATABASE_URL: postgresql://postgres:sgmo-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/sgmo_auth_test_ci
      PORT: '3101'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:auth:legacy
      - name: PostgreSQL migrations and repositories
        run: npm run test:auth:postgres
        env:
          SGMO_TEST_REPORT_DIR: ${{ runner.temp }}/sgmo-test-report
      - name: PostgreSQL authentication through two HTTP processes
        run: node --import tsx scripts/tests/postgres-multiprocess.integration.ts
        env:
          SGMO_TEST_REPORT_DIR: ${{ runner.temp }}/sgmo-test-report
      - name: PostgreSQL sales, inventory and bank payment integrity
        run: node --import tsx scripts/tests/sales-integrity.integration.ts --postgres
      - name: Install isolated SQL WASM runtime
        run: npm install --prefix "$RUNNER_TEMP/sgmo-sql-runtime" @electric-sql/pglite@0.3.14
      - name: Configuration transactions in embedded SQL
        run: node --import tsx scripts/tests/config-sql.integration.ts
        env:
          SGMO_PGLITE_ROOT: ${{ runner.temp }}/sgmo-sql-runtime/node_modules/@electric-sql/pglite
      - name: Preserve redacted test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-auth-report
          path: ${{ runner.temp }}/sgmo-test-report/*.json
          if-no-files-found: ignore
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated browser QA runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/sgmo-browser-runtime" playwright@1.56.1
          "$RUNNER_TEMP/sgmo-browser-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke with ephemeral demo accounts
        run: node scripts/tests/browser-auth.smoke.cjs
        env:
          SGMO_PLAYWRIGHT_MODULES: ${{ runner.temp }}/sgmo-browser-runtime/node_modules
          SGMO_BROWSER_QA_DIR: ${{ runner.temp }}/sgmo-browser-report
          SGMO_BROWSER_QA_PORT: '3102'
      - name: Preserve browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-auth-report
          path: ${{ runner.temp }}/sgmo-browser-report
          if-no-files-found: ignore
          retention-days: 7
